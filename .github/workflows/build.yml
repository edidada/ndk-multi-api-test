name: Build NDK Multi API Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        run: |
          NDK_VERSION=r25b
          echo "Downloading NDK ${NDK_VERSION}..."
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=${PWD}/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Diagnose binder headers
        run: |
          SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          echo "--- grep ServiceManager (any case) ---"
          grep -rli "ServiceManager" "${SYSROOT}/usr/include/" 2>/dev/null | head
          echo "--- grep getService (any case) ---"
          grep -rli "getService" "${SYSROOT}/usr/include/" 2>/dev/null | head
          echo "--- list libbinder_ndk ---"
          find "${ANDROID_NDK_HOME}" -name 'libbinder_ndk*' 2>/dev/null

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29

      - name: Build
        run: |
          cd build
          cmake --build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndk_multi_api_test
          path: build/ndk_multi_api_test
